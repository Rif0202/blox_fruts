  // Gambar buah lokal hasil crop dari kolase yang dikirim pengguna.
  // Tidak memakai gambar kubus atau link gambar eksternal.
  const LOCAL_FRUIT_IMAGES = {
    Rocket:"rocket.png", Spin:"spin.png", Blade:"blade.png", Spring:"spring.png",
    Bomb:"bomb.png", Smoke:"smoke.png", Spike:"spike.png", Flame:"flame.png",
    Ice:"ice.png", Sand:"sand.png", Dark:"dark.png", Eagle:"falcon.png",
    Diamond:"diamond.png", Light:"light.png", Rubber:"rubber.png", Ghost:"ghost.png",
    Magma:"magma.png", Quake:"quake.png", Buddha:"buddha.png", Love:"love.png",
    Creation:"barrier.png", Spider:"spider.png", Sound:"sound.png", Phoenix:"phoenix.png",
    Portal:"portal.png", Lightning:"rumble.png", Pain:"pain.png", Blizzard:"blizzard.png",
    Gravity:"gravity.png",
    // Names updated from the user's latest marked screenshot; artwork stays in its same card.
    Venom:"spirit.png", Spirit:"mammoth.png", Mammoth:"t-rex.png",
    Control:"yeti.png", "T-Rex":"dough.png", Gas:"kitsune.png", Dough:"venom.png",
    Tiger:"tiger.png", Shadow:"control.png", Magnet:"magnet.png", Kitsune:"gas.png",
    Yeti:"shadow.png", Dragon:"leopard.png"
  };
  const MISSING_FRUIT_SYMBOLS = {};

  const grid = document.getElementById("fruitGrid");
  FRUITS.forEach(fruit => {
    const card = document.createElement("a");
    card.className = `fruit-card rarity-${fruit.rarity}`;
    card.href = ROBLOX_URL;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.setAttribute("aria-label", `Pilih ${fruit.name} Permanent Fruit`);

    const artWrap = document.createElement("div");
    artWrap.className = "fruit-art";
    const imageFile = LOCAL_FRUIT_IMAGES[fruit.name];
    if (imageFile) {
      const fruitImg = document.createElement("img");
      fruitImg.className = "fruit-real-image";
      fruitImg.alt = `${fruit.name} Blox Fruits`;
      fruitImg.loading = "lazy";
      fruitImg.decoding = "async";
      fruitImg.src = `./assets/fruits/${imageFile}`;
      fruitImg.onerror = () => {
        fruitImg.remove();
        const fallback = document.createElement("span");
        fallback.className = "fruit-image-missing";
        fallback.textContent = MISSING_FRUIT_SYMBOLS[fruit.name] || "❔";
        artWrap.appendChild(fallback);
      };
      artWrap.appendChild(fruitImg);
    } else {
      const fallback = document.createElement("span");
      fallback.className = "fruit-image-missing";
      fallback.textContent = MISSING_FRUIT_SYMBOLS[fruit.name] || "❔";
      fallback.setAttribute("aria-label", `Gambar ${fruit.name} tidak tersedia di kolase`);
      artWrap.appendChild(fallback);
    }

    const label = document.createElement("span");
    label.className = "fruit-label";
    label.textContent = fruit.name;

    card.appendChild(artWrap);
    card.appendChild(label);
    grid.appendChild(card);
  });

</script>
